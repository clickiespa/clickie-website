<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo a Clickie</title>
  <meta name="robots" content="noindex, follow" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TYPPJZ22DC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-TYPPJZ22DC');
  </script>
  <script src="/scripts/legacy-redirects.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #16302b;
      --muted: #5f716c;
      --brand: #d97841;
      --surface: #fffdf8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7e6 0%, var(--bg) 55%, #e9efe8 100%);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      padding: 24px;
    }
    main {
      width: min(640px, 100%);
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(22, 48, 43, 0.12);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(22, 48, 43, 0.08);
      padding: 32px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 12px;
      line-height: 1.05;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    a {
      color: var(--brand);
      font-weight: 700;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: rgba(217, 120, 65, 0.12);
      color: var(--brand);
      padding: 8px 14px;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid rgba(22, 48, 43, 0.14);
      color: var(--ink);
      background: white;
    }
    .button-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <div class="pill">URL antigua detectada</div>
    <h1>Estamos buscando la página correcta</h1>
    <p id="message">Si esta dirección corresponde a una URL antigua de Clickie, te redirigiremos automáticamente al contenido actualizado.</p>
    <div class="actions">
      <a class="button button-primary" href="https://clickie.io/recursos/blog.html">Ir al blog actual</a>
      <a class="button" href="https://clickie.io/">Ir al inicio</a>
      <a class="button" href="https://clickie.io/cotiza.html">Ir a contacto</a>
    </div>
  </main>
  <script>
    (function() {
      var redirects = window.CLICKIE_LEGACY_REDIRECTS || { exact: {}, normalized: {}, prefixes: {} };
      var message = document.getElementById('message');

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (error) {
          return value;
        }
      }

      function normalizePath(pathname) {
        var value = safeDecode(pathname || '/').toLowerCase();
        value = value.replace(/\/index\.html?$/u, '/');
        value = value.replace(/\.html$/u, '');
        value = value.replace(/\/+$/u, '');
        value = value || '/';
        value = value.normalize('NFD').replace(/[̀-ͯ]/g, '');
        value = value.replace(/⚡️/gu, '').replace(/️/gu, '');
        value = value.replace(/_/g, '-');
        value = value.replace(/[¿¡]/gu, '');
        value = value.replace(/\./g, '');
        value = value.replace(/[^a-z0-9/-]+/g, '-');
        value = value.replace(/-+/g, '-').replace(/\/+/, '/');
        value = value.replace(/\/+$/u, '');
        if (!value.startsWith('/')) {
          value = '/' + value;
        }
        return value === '/' ? value : value.replace(/\/+$/u, '');
      }

      function findTarget(pathname) {
        var decoded = safeDecode(pathname || '/');
        var trimmed = decoded.replace(/\/+$/u, '') || '/';
        var exactCandidates = [pathname, decoded, trimmed, trimmed + '.html'];
        for (var i = 0; i < exactCandidates.length; i += 1) {
          var candidate = exactCandidates[i];
          if (candidate && redirects.exact[candidate]) {
            return redirects.exact[candidate];
          }
        }

        var normalized = normalizePath(decoded);
        var normalizedKey = normalized.replace(/^\//, '');
        if (normalizedKey && redirects.normalized[normalizedKey]) {
          return redirects.normalized[normalizedKey];
        }

        var embeddedRoots = [
          '/io/clickie/blog/',
          '/com/hubspotpagebuilder/clickie-46669151/',
          '/es-cl/',
          '/author/',
          '/tag/'
        ];

        for (var rootIndex = 0; rootIndex < embeddedRoots.length; rootIndex += 1) {
          var root = embeddedRoots[rootIndex];
          var embeddedIndex = decoded.indexOf(root);
          if (embeddedIndex > 0) {
            var derivedPath = '/' + decoded.slice(embeddedIndex + root.length).replace(/^\/+/u, '');
            var derivedTarget = findTarget(derivedPath);
            if (derivedTarget) {
              return derivedTarget;
            }
          }
        }

        for (var prefix in redirects.prefixes) {
          if (Object.prototype.hasOwnProperty.call(redirects.prefixes, prefix) && decoded.startsWith(prefix)) {
            return redirects.prefixes[prefix];
          }
        }

        return null;
      }

      var target = findTarget(window.location.pathname);
      if (target) {
        if (message) {
          message.textContent = 'Encontramos la nueva URL. Te estamos enviando al contenido actualizado.';
        }
        gtag('event', 'legacy_redirect', {
          legacy_path: window.location.pathname,
          redirect_target: target,
          redirect_type: '404_fallback'
        });
        window.location.replace(target);
      }
    })();
  </script>
</body>
</html>
